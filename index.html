<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma de Estudos - Matérias e Temas</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --primary: #4a90e2;
            --primary-hover: #357abd;
            --text-main: #333333;
            --text-muted: #666666;
            --border: #e0e0e0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            color: var(--primary);
            margin-bottom: 5px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .filter-group {
            margin-bottom: 25px;
        }

        label {
            font-weight: 600;
            display: block;
            margin-bottom: 8px;
        }

        select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            font-size: 1rem;
            background-color: #fff;
            outline: none;
            transition: border-color 0.2s;
        }

        select:focus {
            border-color: var(--primary);
        }

        /* Container de Temas */
        #lista-temas {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 25px;
        }

        .tema-btn {
            background-color: #f0f4f8;
            border: 1px solid var(--border);
            padding: 15px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            color: var(--primary);
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tema-btn:hover {
            background-color: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        .btn-voltar {
            background: #e0e0e0;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            margin-bottom: 15px;
            display: none;
        }

        .btn-voltar:hover {
            background: #d0d0d0;
        }

        .question-card {
            background: #fafbfc;
            border: 1px solid var(--border);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .tema-tag {
            display: inline-block;
            background: #e1f0ff;
            color: var(--primary);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .alternativas {
            list-style: none;
            padding: 0;
            margin-top: 15px;
        }

        .alternativas li {
            padding: 10px 15px;
            background: #fff;
            border: 1px solid var(--border);
            margin-bottom: 8px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .alternativas li:hover {
            background: #f0f4f8;
            border-color: var(--primary);
        }

        .comentario {
            margin-top: 15px;
            padding: 12px;
            background: #e8f5e9;
            border-left: 4px solid #4caf50;
            font-size: 0.95rem;
            display: none;
        }
        
        .loading {
            text-align: center;
            color: var(--text-muted);
            font-style: italic;
        }

        a { text-decoration: none;

        }
    </style>
</head>
<body>

    <header>
        <a href="index.html"><h1>Plataforma de Estudos</h1></a>
        <p>Banco de Questões por Matéria e Temas</p>
    </header>

    <div class="container">
        <!-- Seletor de Matérias -->
        <div class="filter-group">
            <label for="filtroMateria">Escolha a Matéria:</label>
            <select id="filtroMateria" onchange="carregarMateria()">
                <option value="">Selecione uma Matéria...</option>
                <option value="constitucional">Direito Constitucional</option>
                <option value="administrativo">Direito Administrativo</option>
                <option value="penal">Direito Penal</option>
                <option value="processual_penal">Direito Processual Penal</option>
                <option value="legislacao_especial">Legislação Especial</option>
                <option value="direitos_humanos">Direitos Humanos</option>
                <option value="portugues">Língua Portuguesa</option>
                <option value="raciocinio_logico">Raciocínio Lógico-Matemático</option>
                <option value="informatica">Informática</option>
                <option value="fisica">Física</option>
                <option value="etica_cid">Ética e Cidadania</option>
                <option value="geopolitica">Geopolítica</option>
                <option value="lingua_estrangeira">Língua Estrangeira</option>
                <option value="transito">Legislação de Trânsito</option>
            </select>
        </div>

        <!-- Botão para voltar aos temas -->
        <button id="btnVoltar" class="btn-voltar" onclick="voltarParaTemas()">← Voltar aos Temas</button>

        <!-- Área onde aparecem os botões dos temas ou as questões -->
        <div id="painel-conteudo">
            <p class="loading">Selecione uma matéria acima para ver os temas disponíveis.</p>
        </div>
    </div>

    <script>
        let dadosMateriaAtual = null;

        async function carregarMateria() {
            const materiaSelecionada = document.getElementById('filtroMateria').value;
            const painel = document.getElementById('painel-conteudo');
            const btnVoltar = document.getElementById('btnVoltar');
            
            btnVoltar.style.display = 'none';

            if (!materiaSelecionada) {
                painel.innerHTML = '<p class="loading">Selecione uma matéria acima para ver os temas disponíveis.</p>';
                dadosMateriaAtual = null;
                return;
            }

            painel.innerHTML = '<p class="loading">Carregando temas...</p>';

            try {
                const response = await fetch(`data/${materiaSelecionada}.json`);
                if (!response.ok) {
                    throw new Error("Arquivo JSON não encontrado.");
                }
                dadosMateriaAtual = await response.json();
                exibirTemas(dadosMateriaAtual);
            } catch (error) {
                console.error(error);
                painel.innerHTML = `<p style="text-align: center; color: #d9534f;">Ainda não há arquivo JSON cadastrado para esta matéria na pasta <b>data/</b> (ex: <code>${materiaSelecionada}.json</code>).</p>`;
                dadosMateriaAtual = null;
            }
        }

        function exibirTemas(dados) {
            const painel = document.getElementById('painel-conteudo');
            painel.innerHTML = '<h3>Escolha um Tema:</h3><div id="lista-temas"></div>';
            const listaTemasDiv = document.getElementById('lista-temas');

            if (!dados.temas || dados.temas.length === 0) {
                listaTemasDiv.innerHTML = '<p style="color: var(--text-muted);">Nenhum tema cadastrado nesta matéria ainda.</p>';
                return;
            }

            dados.temas.forEach((tema, index) => {
                const btn = document.createElement('button');
                btn.className = 'tema-btn';
                btn.innerHTML = `📚 ${tema.nomeTema} <span style="font-size:0.8rem; color:var(--text-muted); font-weight:normal;">(${tema.questoes.length} questões)</span>`;
                btn.onclick = () => exibirQuestoesDoTema(index);
                listaTemasDiv.appendChild(btn);
            });
        }

      function exibirQuestoesDoTema(indexTema) {
            const temaObj = dadosMateriaAtual.temas[indexTema];
            const painel = document.getElementById('painel-conteudo');
            const btnVoltar = document.getElementById('btnVoltar');

            btnVoltar.style.display = 'block';
            painel.innerHTML = `<h2>Tema: ${temaObj.nomeTema}</h2>`;

            if (!temaObj.questoes || temaObj.questoes.length === 0) {
                painel.innerHTML += '<p style="text-align: center; color: var(--text-muted);">Nenhuma questão cadastrada neste tema ainda.</p>';
                return;
            }

            temaObj.questoes.forEach((q, qIndex) => {
                let htmlAlternativas = '';
                q.options.forEach((opt, optIndex) => {
                    // Passamos o texto da opção selecionada para comparar com a resposta correta em formato string
                    htmlAlternativas += `<li onclick="verificarResposta(this, '${opt.replace(/'/g, "\\'")}', '${q.correctAnswer.replace(/'/g, "\\'")}')">${opt}</li>`;
                });

                const card = document.createElement('div');
                card.className = 'question-card';
                const uniqueId = 'comentario-' + qIndex + '-' + Math.floor(Math.random() * 1000);
                
                card.innerHTML = `
                    <span class="tema-tag">${temaObj.nomeTema}</span>
                    <p><strong>Questão ${qIndex + 1}:</strong> ${q.question}</p>
                    <ul class="alternativas">${htmlAlternativas}</ul>
                    <div class="comentario" id="${uniqueId}">
                        <strong>Explicação:</strong> ${q.explanation}
                    </div>
                `;
                painel.appendChild(card);
            });
        }

        function voltarParaTemas() {
            if (dadosMateriaAtual) {
                document.getElementById('btnVoltar').style.display = 'none';
                exibirTemas(dadosMateriaAtual);
            }
        }


        function verificarResposta(elemento, textoSelecionado, textoCorreto) {
            const pai = elemento.parentElement;
            const itens = pai.getElementsByTagName('li');
            
            for (let item of itens) {
                item.style.pointerEvents = 'none';
            }

            // Compara o texto da opção clicada com a string correta
            if (textoSelecionado === textoCorreto) {
                elemento.style.backgroundColor = '#d4edda';
                elemento.style.borderColor = '#c3e6cb';
                elemento.style.color = '#155724';
            } else {
                elemento.style.backgroundColor = '#f8d7da';
                elemento.style.borderColor = '#f5c6cb';
                elemento.style.color = '#721c24';
                
                // Encontra e destaca a alternativa correta automaticamente
                for (let item of itens) {
                    if (item.textContent === textoCorreto) {
                        item.style.backgroundColor = '#d4edda';
                        item.style.borderColor = '#c3e6cb';
                        item.style.color = '#155724';
                    }
                }
            }

            const cardPai = pai.closest('.question-card');
            const comentarioDiv = cardPai.querySelector('.comentario');
            if (comentarioDiv) {
                comentarioDiv.style.display = 'block';
            }
        }
    </script>
</body>
</html>
